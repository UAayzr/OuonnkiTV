services:
  ouonnkitv:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: ${BUILD_DATE:-}
        VCS_REF: ${VCS_REF:-}
        VERSION: ${VERSION:-dev}
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
      - OKI_INITIAL_VIDEO_SOURCES=${OKI_INITIAL_VIDEO_SOURCES:-}
      - OKI_ACCESS_PASSWORD=${OKI_ACCESS_PASSWORD:-}
      - OKI_DISABLE_ANALYTICS=${OKI_DISABLE_ANALYTICS:-true}
      - OKI_INITIAL_CONFIG=${OKI_INITIAL_CONFIG:-}
      # 播放加速:代理缓存目录(磁盘 LRU,ts 分片/清单/详情 JSON 复用)
      - PROXY_CACHE_DIR=/data/proxy-cache
      # TTL(秒):详情 JSON 10min / 清单 15min / 分片 7 天,均可按需覆盖
      - PROXY_CACHE_TTL_JSON=600
      - PROXY_CACHE_TTL_M3U8=900
      - PROXY_CACHE_TTL_TS=604800
      # 分片缓存上限:约 2GB / 1500 条(覆盖一部完整电影+多部剧集复看)
      - PROXY_CACHE_MAX_BYTES=2147483648
      - PROXY_CACHE_TS_MAX_ENTRIES=1500
    volumes:
      - ouonnkitv-proxy-cache:/data/proxy-cache
    restart: unless-stopped
    container_name: ouonnkitv-dev

    # 日志轮转
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # 资源限制
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  ouonnkitv-proxy-cache:
